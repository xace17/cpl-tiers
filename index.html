<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1014">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<title>CPL Tiers · Combat Premier League</title>
<meta name="description" content="Combat Premier League tier rankings: overall leaderboard, every gamemode and player profiles.">
<style>
:root{--bg:#0e1014;--card:#161920;--card2:#1d212a;--line:#262b36;--text:#eef0f5;--mut:#8b93a3;--acc:#e8eaf0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
header{padding:20px 16px 10px;display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.logo{width:42px;height:42px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.5px}
header h1{font-size:20px;line-height:1.1;font-weight:800}
header small{color:var(--mut);font-size:12px}
main{max-width:900px;margin:0 auto;padding:0 16px 40px}
.banner{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--mut);padding:11px 12px 9px;font:700 13px 'Outfit',system-ui,sans-serif;cursor:pointer}
.tab svg{display:block;opacity:.65}
.tab.on{color:var(--text);background:var(--card2);border-color:#3a4150;box-shadow:inset 0 -3px 0 var(--acc)}
.tab.on svg{opacity:1}
.tools{display:flex;gap:8px;margin:2px 0 14px}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:500 14px 'Outfit',system-ui,sans-serif;outline:none}
.tools input{flex:1;min-width:0}
.tools input:focus,.tools select:focus{border-color:#4a5263}
.tools select option{background:#161920;color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--card2)}
.r1{border-left:4px solid #ffd24a}.r2{border-left:4px solid #c9d0dc}.r3{border-left:4px solid #d98b55}
.pos{min-width:26px;text-align:center;font-weight:800;font-size:17px;color:var(--mut)}
.r1 .pos{color:#ffd24a}.r2 .pos{color:#c9d0dc}.r3 .pos{color:#d98b55}
.head{width:46px;height:46px;border-radius:8px;image-rendering:pixelated;background:var(--card2);flex:0 0 auto}
.who{flex:1;min-width:0}
.name{font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.reg{font-size:11px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:var(--card2);white-space:nowrap}
.badge.t1{color:#ff7a95}.badge.t2{color:#ffb35e}.badge.t3{color:#ffd95a}.badge.t4{color:#6ee7a0}.badge.t5{color:#7cc4ff}
.pts{flex:0 0 auto;font-weight:800;font-size:17px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;text-align:center;line-height:1}
.pts small{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.tiersec{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.tierhead{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;padding:2px 2px}
.tierhead i{font-style:normal;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);padding:1px 9px;border-radius:6px;color:var(--text)}
.tierhead::after{content:"";flex:1;height:1px;background:var(--line);order:3}
.tierhead.t1{color:#ff7a95}.tierhead.t2{color:#ffb35e}.tierhead.t3{color:#ffd95a}.tierhead.t4{color:#6ee7a0}.tierhead.t5{color:#7cc4ff}
.tempty{color:var(--mut);font-size:13px;padding:2px 4px 4px}
.empty{color:var(--mut);text-align:center;padding:48px 10px}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;width:min(440px,92vw);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
.mhead{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid var(--line)}
.mhead img{width:64px;height:64px;border-radius:10px;image-rendering:pixelated}
.mhead h2{font-size:20px;overflow-wrap:anywhere}
.mbody{padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
.mrow .badge{margin-left:auto}
.close{margin:0 18px 18px;width:calc(100% - 36px);background:var(--card2);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:8px;font:700 14px 'Outfit',system-ui,sans-serif;cursor:pointer}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 16px 34px}
</style>
</head>

  size = size || 28;

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){

  var sum = 0;
  Object.keys(p.modes || {}).forEach(function(m){ sum += POINTS[p.modes[m].tier] || 0; });
  return sum;
}

function rows(){
  var out = [];
  var players = state.data.players || {};
  Object.keys(players).forEach(function(name){
    var p = players[name];
    if (state.region !== "All" && p.region !== state.region) return;
    if (state.q && name.toLowerCase().indexOf(state.q) === -1) return;
    if (state.mode === "Overall") {
      if (!Object.keys(p.modes || {}).length) return;
      out.push({name:name, p:p, pts:total(p)});
    } else {
      var m = (p.modes || {})[state.mode];
      if (!m) return;
      out.push({name:name, p:p, pts:POINTS[m.tier] || 0, tier:m.tier});
    }
  });
  out.sort(function(a,b){ return b.pts - a.pts || a.name.localeCompare(b.name); });
  return out;
}

function badge(m, t){
  return '<span class="badge ' + tierClass(t) + '">' + icon(m, 14) + esc(t) + '</span>';
}

function rowHtml(x, i){
  var overall = state.mode === "Overall";
  var badges;
  if (overall) {
    badges = Object.keys(x.p.modes).map(function(m){ return badge(m, x.p.modes[m].tier); }).join("");
  } else {
    badges = badge(state.mode, x.tier);
  }
  var cls = "row" + (overall && i < 3 ? " r" + (i + 1) : "");
  return '<div class="' + cls + '" data-n="' + esc(x.name) + '">' +
    (overall ? '<div class="pos">' + (i + 1) + '</div>' : '') +
    '<img class="head" loading="lazy" alt="" src="' + head(x.name) + '">' +
    '<div class="who"><div class="name">' + esc(x.name) + '</div>' +
    '<div class="meta"><span class="reg">' + esc(x.p.region || "") + '</span>' + badges + '</div></div>' +
    (overall ? '<div class="pts">' + x.pts + '<small>pts</small></div>' : '') + '</div>';
}

function render(){
  var tabs = ["Overall"].concat(MODES);
  document.getElementById("tabs").innerHTML = tabs.map(function(t){
    return '<button class="tab' + (t === state.mode ? " on" : "") + '" data-m="' + esc(t) + '">' + icon(t, 30) + '<span>' + esc(t) + '</span></button>';
  }).join("");

  var r = rows();
  var list = document.getElementById("list");
  if (!r.length) { list.innerHTML = '<div class="empty">No players here yet.</div>'; return; }
  if (state.mode === "Overall") {
    list.innerHTML = r.map(rowHtml).join("");
    return;
  }
  var html = "";
  for (var n = 1; n <= 5; n++) {
    var grp = r.filter(function(x){ return String(x.tier).charAt(2) === String(n); });
    html += '<div class="tiersec"><div class="tierhead t' + n + '">Tier ' + n + '<i>' + grp.length + '</i></div>' +
      (grp.length ? grp.map(rowHtml).join("") : '<div class="tempty">No players</div>') + '</div>';
  }
  list.innerHTML = html;
}

function openProfile(name){
  var p = (state.data.players || {})[name];
  if (!p) return;
  var modes = Object.keys(p.modes || {}).map(function(m){
    return '<div class="mrow">' + icon(m, 22) + '<span>' + esc(m) + '</span>' + badge(m, p.modes[m].tier) + '</div>';
  }).join("");
  var d = document.getElementById("modal");
  d.innerHTML = '<div class="mhead"><img alt="" src="' + head(name) + '"><div><h2>' + esc(name) + '</h2>' +
    '<div class="sub" style="color:var(--mut);font-size:13px;margin-top:4px">' + esc(p.region || "") + ' · ' + total(p) + ' points</div></div></div>' +
    '<div class="mbody">' + (modes || '<div class="empty">No tests yet.</div>') + '</div>' +
    '<button class="close" id="closeBtn">Close</button>';
  d.showModal();
  document.getElementById("closeBtn").onclick = function(){ d.close(); };
}

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest(".tab");
  if (!b) return;
  state.mode = b.getAttribute("data-m");
  render();
});
document.getElementById("list").addEventListener("click", function(e){
  var r = e.target.closest(".row");
  if (r) openProfile(r.getAttribute("data-n"));
});
document.getElementById("search").addEventListener("input", function(e){
  state.q = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("region").addEventListener("change", function(e){
  state.region = e.target.value;
  render();
});
document.getElementById("modal").addEventListener("click", function(e){
  if (e.target === this) this.close();
});

function load(){
  fetch(DATA_URL + "?t=" + Date.now())
    .then(function(r){ if (!r.ok) throw new Error("bad"); return r.json(); })
    .then(function(j){ state.data = j; render(); })
    .catch(function(){
      state.data = {players:{}};
      render();
    });
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
